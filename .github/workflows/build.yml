name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build installer
        run: |
          # AudioLimiter.exe lands in build/Release under the MSVC generator
          # but in build/ under single-config generators. Normalise before
          # NSIS looks for it at the path in installer.nsi.
          if (Test-Path build\Release\AudioLimiter.exe) {
            Copy-Item build\Release\AudioLimiter.exe build\AudioLimiter.exe -Force
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Brace syntax is required: "$env:ProgramFiles(x86)" parses as
          # $env:ProgramFiles followed by a literal "(x86)".
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = "$env:ProgramFiles\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
            $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          & $nsis /V2 installer\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

      - name: Checksums
        run: |
          Get-FileHash dist\AudioLimiter-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  AudioLimiter-Setup.exe" } |
            Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AudioLimiter-Setup
          path: |
            dist/AudioLimiter-Setup.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AudioLimiter-Setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
